name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache Homebrew installations across runs
      - uses: actions/cache@v4
        id: homebrew-cache
        with:
          path: |
            ~/Library/Caches/Homebrew
            /Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
            /usr/local/Cellar/swiftlint
            /usr/local/Cellar/gitleaks
            /usr/local/Cellar/supabase
            /usr/local/Cellar/deno
          key: ${{ runner.os }}-homebrew-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      # Install tooling (Homebrew cache speeds this up)
      - name: Install XcodeGen, SwiftLint, Gitleaks, Supabase, Deno
        run: |
          brew install xcodegen swiftlint gitleaks supabase/tap/supabase deno || true

      # xcodegen: regenerate project from project.yml to catch mismatches
      - name: XcodeGen generate
        run: xcodegen generate

      # SwiftLint: strict mode with custom rule for hardcoded password leak
      - name: SwiftLint
        run: swiftlint lint --strict

      # Gitleaks: scan for accidentally committed secrets
      - name: Gitleaks
        run: gitleaks detect --source . --no-banner

      # TLS pin guard (T002) — inline fast-fail: any literal placeholder byte
      # sequence in the pin file blocks CI on every branch immediately.
      - name: Refuse placeholder TLS pins
        run: |
          if grep -E "0x00, 0x00, 0x00, 0x00|0x01, 0x01, 0x01, 0x01" LadderApp/Services/Networking/TLSPinnedSession.swift ; then
            echo "::error::Placeholder TLS pins detected — generate real ones via scripts/generate-tls-pin.sh"
            exit 1
          fi

      # TLS pin guard — deeper check: fails on main/release/*, warns elsewhere
      - name: TLS pin placeholder check (branch-aware)
        run: ./scripts/check_tls_pins.sh

  ios-build-test:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # Cache Xcode derived data (SPM, build artifacts)
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('LadderApp.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      # Resolve SPM packages (workaround for swift-clocks CLI issue)
      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LadderApp.xcodeproj \
            -scheme LadderApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' || true

      # Build for iOS simulator
      - name: Build
        run: |
          xcodebuild -project LadderApp.xcodeproj \
            -scheme LadderApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' \
            build

      # Unit tests (LadderAppTests bundle)
      - name: Unit tests
        run: |
          xcodebuild test \
            -project LadderApp.xcodeproj \
            -scheme LadderAppTests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro'

      # E2E smoke test — catches stub-button regressions like S3#17
      - name: E2E smoke test (Signup)
        run: |
          xcodebuild test \
            -project LadderApp.xcodeproj \
            -scheme LadderAppE2E \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' \
            -only-testing:LadderAppE2E/SignupSmokeTest

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with: { deno-version: v1.45.x }

      # Run Deno tests only if LadderBackend changed
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'LadderBackend/**'

      - name: Deno fmt --check
        if: steps.filter.outputs.backend == 'true'
        run: deno fmt --check LadderBackend/

      - name: Deno test
        if: steps.filter.outputs.backend == 'true'
        run: deno test --allow-all LadderBackend/

      - name: Scheduling engine tests
        if: steps.filter.outputs.backend == 'true'
        run: deno test --allow-all tests/scheduling/

      - name: Flags (Varun) tests
        if: steps.filter.outputs.backend == 'true'
        run: deno test --allow-all tests/flags/

      - name: Crypto tests
        if: steps.filter.outputs.backend == 'true'
        run: deno test --allow-all tests/crypto/
